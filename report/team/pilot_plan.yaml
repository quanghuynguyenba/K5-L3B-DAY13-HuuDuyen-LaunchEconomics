# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu mỗi nhóm -> 42 nhân viên mỗi nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: giới hạn hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt 5 điểm)
#   d) 6 depot mỗi nhóm: giới hạn hiệu dụng tối đa 6 / 0,02 = 300 (loại)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm song song cùng tuần và cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng script Python với seed cố định ghi trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi gợi ý; giảm bằng cấp quyền theo tài khoản riêng và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày bắt đầu pilot (2026-12-01) trong tài liệu này.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên hiện có, không đủ cỡ mẫu để phát hiện mức chênh +5 điểm (tối đa 1.000 < 1.251). Nhóm chấp nhận MDE +6 điểm (cần 859/nhóm, m >= 299 yêu cầu/nhân viên); nếu tác động thật là +5 điểm, power giảm còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại là 4,25% (51/1.200) trên toàn bộ và 3,97% (39/982) trong phạm vi noi_dia + hang_nang. Đặt ngưỡng so với đối chứng (cao hơn >= 2 điểm phần trăm) kèm trần tuyệt đối 6% để tránh dừng oan ngay tuần đầu.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22x) và hang_nang (0,69x so với 12.000 đ, simulated) trên toàn bộ 12 depot; loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên (mỗi bước 1 tuần); chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy song song cùng thời gian, phân tầng theo depot"
    spillover_risk: "Có nguy cơ trao đổi câu trả lời giữa nhân viên cùng depot; giảm bằng phân quyền theo staff_id và log truy cập trợ lý"
    predeclared: "Đã chốt trước chỉ số chính, MDE 0,06, ba luật dừng và ngày quyết định 2027-01-05"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt 6%, hoặc phát hiện >= 1 ca hoàn tiền trùng lặp TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong vòng 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng thêm depot hay loại đơn hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên và rà lại prompt/UX trong 3 ngày KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành tắt cờ tính năng (feature flag) trong tối đa 30 phút; toàn bộ yêu cầu hoàn phí chuyển ngay về luồng nhân viên CSKH tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công gốc 4.472 đ và phạm vi noi_dia + hang_nang gồm cố định 4.599 đ/việc [simulated]"
    - "Chi phí theo loại: noi_dia 2.696 đ (0,22x), hang_nang 8.221 đ (0,69x), quoc_te 22.515 đ (1,88x), doi_tac 10.215 đ (0,85x) [simulated]"
    - "Thời gian xem lại (890 phút) và làm lại (1.132 phút) dùng phut_xem_lai_simulated và phut_lam_lai_simulated"
